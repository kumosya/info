set timeout=0
set default=0
set gfxmode=1024x768x32
set gfxpayload=keep

menuentry "OS Info x86-64" {
    multiboot2 /boot/kernel.elf
    module2 /boot/init.elf init
    module2 /boot/task.elf task
    module2 /boot/fs.elf fs
    module2 /boot/pci.elf pci
    module2 /boot/device.elf device
    module2 /boot/storage.elf storage
    module2 /boot/libos-c++.so libos-c++.so
    module2 /boot/tty.elf tty
    module2 /boot/console.elf console
    module2 /boot/guiw.elf guiw
    module2 /boot/users.elf users
    module2 /boot/mm.elf mm
    module2 /boot/pipe.elf pipe
    module2 /boot/msgq.elf msgq
    module2 /boot/libc.so libc.so
    module2 /boot/libc++.so libc++.so
    module2 /boot/libosgui-c++.so libosgui-c++.so
    boot
}
